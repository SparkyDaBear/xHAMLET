name: Deploy Results Explorer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/results-explorer/**
      - scripts/sync_result_database.py

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/results-explorer
      - id: deployment
        uses: actions/deploy-pages@v4