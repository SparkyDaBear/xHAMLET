# PXD Metadata Enhancer Configuration
# Edit this file for your local/default settings.

pride:
  base_url: "https://www.ebi.ac.uk/pride/ws/archive/v3"
  timeout: 30

pmc:
  # Email is recommended for PMC/NCBI requests
  email: null
  # NCBI API key is optional but helps with rate limits
  api_key: null

llm:
  model: "google/gemma-4-31b-it"
  temperature: 0.0
  max_retries: 0
  # API base URL. Leave null to auto-detect: uses OpenRouter
  # (https://openrouter.ai/api/v1) when OPENROUTER_API_KEY is set in the
  # environment, otherwise falls back to calling OpenAI directly with
  # OPENAI_API_KEY. When routed through OpenRouter, `model` above must be an
  # OpenRouter model slug (e.g. "openai/gpt-4o-mini"), not a bare OpenAI name.
  base_url: null

storage:
  base_dir: "./store"
  cache_pride: true
  cache_pmc: true
  cache_llm: true

relink:
  # Nextflow intermediates only; final ReLink results remain under storage.base_dir.
  work_dir: "/storage/group/epo2/default/ims86/git_repos/xHAMLET/tools/relink/work"

prompts:
  dir: "./prompts"
  # Stage 5 prompt files to use by default.
  enabled:
    - disease_treatment
    - factor_values
    - ms_acquisition
    - organism_sample
    - sample_attributes
    - sample_preparation
    - xlms_conditions
    - xlms_reagents

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
