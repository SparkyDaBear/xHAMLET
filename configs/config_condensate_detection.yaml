# Configuration for condensate_detection extraction only
# This is a standalone config to avoid mixing with the main pipeline
# Use with: python scripts/test_condensate_detection.py --config configs/config_condensate_detection.yaml

pride:
  base_url: "https://www.ebi.ac.uk/pride/ws/archive/v3"
  timeout: 30

pmc:
  # Email is recommended for PMC/NCBI requests
  email: null
  # NCBI API key is optional but helps with rate limits
  api_key: null

llm:
  model: "gpt-5.4-nano-2026-03-17"
  temperature: 0.0
  max_retries: 0

storage:
  # Use separate directory to avoid overwriting main pipeline results
  base_dir: "./pxd_data_condensate"
  cache_pride: true
  cache_pmc: true
  cache_llm: true

prompts:
  dir: "./prompts"
  # Only run condensate_detection prompt
  enabled:
    - condensate_detection

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
